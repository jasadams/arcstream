services:

  # ── Layer 0: Infrastructure ────────────────────────────────────────

  redpanda:
    image: redpandadata/redpanda:v24.3.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
      - --schema-registry-addr=0.0.0.0:8081
    ports:
      - "19092:19092"
      - "8082:8082"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9644/v1/status/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # ── Layer 1: Flink stream processing ──────────────────────────────

  flink-jobmanager:
    image: ghcr.io/jasadams/arcstream/flink:latest
    platform: linux/amd64
    entrypoint: ["/bin/bash", "-c"]
    command: ["exec /docker-entrypoint.sh jobmanager"]
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 1
        state.backend: rocksdb
        state.backend.incremental: true
        state.checkpoints.dir: file:///flink-checkpoints
        state.backend.rocksdb.localdir: /flink-rocksdb
        execution.checkpointing.interval: 60000
        execution.checkpointing.min-pause: 30000
      FLINK_ENV_JAVA_OPTS: "--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED"
    volumes:
      - flink-checkpoints:/flink-checkpoints
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  flink-taskmanager:
    image: ghcr.io/jasadams/arcstream/flink:latest
    platform: linux/amd64
    entrypoint: ["/bin/bash", "-c"]
    command: ["exec /docker-entrypoint.sh taskmanager"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 4
        state.backend: rocksdb
        state.backend.incremental: true
        state.checkpoints.dir: file:///flink-checkpoints
        state.backend.rocksdb.localdir: /flink-rocksdb
      FLINK_ENV_JAVA_OPTS: "--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED"
    volumes:
      - flink-checkpoints:/flink-checkpoints
    depends_on:
      flink-jobmanager:
        condition: service_healthy

  # One-shot: submit the 3 Flink jobs once task slots are available.
  init-flink-jobs:
    image: ghcr.io/jasadams/arcstream/flink:latest
    platform: linux/amd64
    restart: "no"
    environment:
      KAFKA_BROKERS: redpanda:9092
      FLINK_ENV_JAVA_OPTS: "--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED"
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "rest.address: flink-jobmanager" >> /opt/flink/conf/flink-conf.yaml
        echo "Waiting for Flink task slots..."
        for i in $$(seq 1 60); do
          slots=$$(curl -s http://flink-jobmanager:8081/overview 2>/dev/null | grep -o '"slots-available":[0-9]*' | cut -d: -f2)
          [ -n "$$slots" ] && [ "$$slots" -gt 0 ] && { echo "slots: $$slots"; break; }
          sleep 5
        done
        run() { /opt/flink/bin/flink run -d -m flink-jobmanager:8081 -c "$$1" /opt/flink/jobs/identity-resolution.jar; }
        run com.pipeline.identity.IdentityResolutionJob
        run com.pipeline.profile.ProfileUpdaterJob
        run com.pipeline.session.SessionizationJob

  # ── Layer 2: FlareDB OLAP database ────────────────────────────────

  flaredb:
    image: ghcr.io/jasadams/arcstream/flaredb:1.0.49
    command: >
      --data-dir /data
      --http 0.0.0.0:8099
      --load-tables /config
      --brokers redpanda:9092
    volumes:
      - ./config/flaredb-tables:/config:ro
      - flaredb-data:/data
    ports:
      - "8099:8099"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8099/query/sql -X POST -H 'Content-Type: application/json' -d '{\"sql\":\"SELECT 1\"}' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Layer 3: Application services ─────────────────────────────────

  event-producer:
    image: ghcr.io/jasadams/arcstream/event-producer:latest
    platform: linux/amd64
    command: ["--broker=redpanda:9092", "--topic=raw-events", "--tenants=5", "--target-daily-events=3200000", "--daily-variance=3.0"]
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  query-api:
    image: ghcr.io/jasadams/arcstream/query-api:latest
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      FLAREDB_URL: http://flaredb:8099
      KAFKA_BROKERS: redpanda:9092
      ENABLE_PLAYGROUND: "true"
    depends_on:
      flaredb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    image: ghcr.io/jasadams/arcstream/dashboard:latest
    platform: linux/amd64
    ports:
      - "3000:3000"
    environment:
      QUERY_API_URL: http://query-api:8080/graphql
      DEV_PANEL: "1"
      LEPTOS_SITE_ROOT: /site
      LEPTOS_SITE_PKG_DIR: pkg
      LEPTOS_SITE_ADDR: 0.0.0.0:3000
      LEPTOS_OUTPUT_NAME: dashboard
    depends_on:
      query-api:
        condition: service_started
    restart: unless-stopped

volumes:
  redpanda-data:
  flink-checkpoints:
  flaredb-data:
