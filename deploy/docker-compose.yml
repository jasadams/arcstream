  # ── Layer 4b: Arroyo stream processing ────────────────────────────

  arroyo:
    image: ghcr.io/arroyosystems/arroyo:latest
    ports:
      - "5115:5115"
    environment:
      ARROYO__CHECKPOINT_URL: /tmp/arroyo/checkpoints
    volumes:
      - arroyo-data:/root/.config/arroyo
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5115"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Layer 5: Application services ──────────────────────────────────

  event-producer:
    image: ghcr.io/jasadams/arcstream/event-producer:latest
    platform: linux/amd64
    command: ["--broker=redpanda:9092", "--topic=raw-events", "--tenants=5", "--target-daily-events=3200000", "--daily-variance=3.0"]
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  query-api:
    image: ghcr.io/jasadams/arcstream/query-api:latest
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      PINOT_BROKER_URL: http://pinot-broker:8099/query/sql
      KAFKA_BROKERS: redpanda:9092
      ENABLE_PLAYGROUND: "true"
    depends_on:
      pinot-broker:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      init-pinot:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    image: ghcr.io/jasadams/arcstream/dashboard:latest
    platform: linux/amd64
    ports:
      - "3000:3000"
    environment:
      QUERY_API_URL: http://query-api:8080/graphql
      DEV_PANEL: "1"
      LEPTOS_SITE_ROOT: /site
      LEPTOS_SITE_PKG_DIR: pkg
      LEPTOS_SITE_ADDR: 0.0.0.0:3000
      LEPTOS_OUTPUT_NAME: dashboard
    depends_on:
      query-api:
        condition: service_started
    restart: unless-stopped

volumes:
  redpanda-data:
  zookeeper-data:
  minio-data:
  pinot-controller-data:
  pinot-server-data:
  arroyo-data:
